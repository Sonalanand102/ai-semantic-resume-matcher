version: '3.9'

services:

  backend:
    build: .

    container_name: ai-job-matcher-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

    volumes:
      - .:/app

  postgres:
    image: pgvector/pgvector:pg16

    container_name: ai-job-matcher-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_job_matcher

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: ai-job-matcher-redis

    ports:
      - "6379:6379"

volumes:
  postgres_data: